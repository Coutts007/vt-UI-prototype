openapi: 3.1.0
info:
  title: Virtual Tailor API
  version: 0.1.0
  description: >
    The single source of truth for the API. Lengths are integer millimetres, timestamps are
    ISO 8601 UTC, and errors are RFC 9457 problem+json with a stable code from error-codes.json.
    No endpoint accepts or stores an image.
servers:
  - url: /api/v1
tags:
  - name: public
  - name: auth
  - name: clients
  - name: profiles
  - name: orders
  - name: sheets
  - name: audit
  - name: admin
  - name: study

paths:
  /health:
    get:
      operationId: getHealth
      tags: [public]
      summary: Liveness check
      responses:
        '200':
          description: The API is running
          content: { application/json: { schema: { $ref: '#/components/schemas/Status' } } }
  /ready:
    get:
      operationId: getReady
      tags: [public]
      summary: Readiness check, including the database
      responses:
        '200':
          description: The API can reach the database
          content: { application/json: { schema: { $ref: '#/components/schemas/Status' } } }
        '503':
          description: The database cannot be reached
          content: { application/json: { schema: { $ref: '#/components/schemas/Status' } } }
  /settings/public:
    get:
      operationId: getPublicSettings
      tags: [public]
      summary: Feature switches for the app
      responses:
        '200':
          description: Public settings
          content: { application/json: { schema: { $ref: '#/components/schemas/PublicSettings' } } }
  /rules/current:
    get:
      operationId: getCurrentRules
      tags: [public]
      summary: The current rules artifact, with its status
      description: Before the owner freezes any rules, this returns an artifact with status draft.
      responses:
        '200':
          description: Rules artifact
          content: { application/json: { schema: { $ref: '#/components/schemas/RulesArtifact' } } }
  /rules/{version}:
    get:
      operationId: getRules
      tags: [public]
      summary: One rules artifact by version
      parameters:
        - { name: version, in: path, required: true, schema: { $ref: '#/components/schemas/RulesVersion' } }
      responses:
        '200':
          description: Rules artifact
          content: { application/json: { schema: { $ref: '#/components/schemas/RulesArtifact' } } }
        '404': { $ref: '#/components/responses/Problem' }
  /client-codes/{code}:
    get:
      operationId: verifyClientCode
      tags: [public]
      summary: Check a client code
      parameters:
        - { name: code, in: path, required: true, schema: { $ref: '#/components/schemas/ClientCode' } }
      x-rate-limit: 10 per minute, 100 per day
      responses:
        '200':
          description: The code exists
          content: { application/json: { schema: { $ref: '#/components/schemas/ClientCodeCheck' } } }
        '404': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /profiles:
    post:
      operationId: syncProfile
      tags: [profiles]
      summary: Sync a profile from a phone
      x-audit: profile_ingest
      x-rate-limit: 30 per hour per IP, 10 per hour per client code
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: The profile_id
          schema: { type: string, format: uuid, maxLength: 36 }
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/MeasurementProfilePayload' } }
      responses:
        '201':
          description: Stored, or an identical replay of an earlier request
          content: { application/json: { schema: { $ref: '#/components/schemas/ProfileAccepted' } } }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/ProfileConflict' }
        '413': { $ref: '#/components/responses/Problem' }
        '415': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /deletion-requests:
    post:
      operationId: requestDeletion
      tags: [profiles]
      summary: Ask for a client's data to be deleted, or withdraw consent
      x-audit: deletion_request
      x-rate-limit: 5 per hour
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/DeletionRequestInput' } }
      responses:
        '202':
          description: Accepted
          content: { application/json: { schema: { $ref: '#/components/schemas/DeletionRequestReceipt' } } }
        '404': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /data-requests/access:
    post:
      operationId: requestDataAccess
      tags: [profiles]
      summary: Get a copy of a client's stored data
      x-audit: access_request
      x-rate-limit: 5 per hour
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/AccessRequestInput' } }
      responses:
        '200':
          description: The client's stored data
          content: { application/json: { schema: { $ref: '#/components/schemas/ClientDataExport' } } }
        '404': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register as a tailor
      x-audit: register
      x-rate-limit: 5 per hour
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RegisterInput' } } }
      responses:
        '201':
          description: Waiting for approval
          content: { application/json: { schema: { $ref: '#/components/schemas/RegisterResult' } } }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in
      x-audit: login
      x-rate-limit: 20 per minute per IP, plus the account lockout
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/LoginInput' } } }
      responses:
        '200':
          description: Signed in
          content: { application/json: { schema: { $ref: '#/components/schemas/LoginResult' } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Sign out
      x-audit: logout
      x-roles: [tailor, admin, measurer]
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Signed out }
        '401': { $ref: '#/components/responses/Problem' }
  /me:
    get:
      operationId: getMe
      tags: [auth]
      summary: The signed-in user
      x-roles: [tailor, admin, measurer]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: User
          content: { application/json: { schema: { $ref: '#/components/schemas/User' } } }
        '401': { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updateMe
      tags: [auth]
      summary: Change profile details and settings
      x-audit: settings_change
      x-roles: [tailor, admin, measurer]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UserUpdate' } } }
      responses:
        '200':
          description: Updated user
          content: { application/json: { schema: { $ref: '#/components/schemas/User' } } }
        '401': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /me/password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Change password, which signs out every other session
      x-audit: settings_change
      x-roles: [tailor, admin, measurer]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PasswordChange' } } }
      responses:
        '204': { description: Changed }
        '401': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /me/ease-presets:
    get:
      operationId: getEasePresets
      tags: [orders]
      summary: The tailor's saved ease values
      x-roles: [tailor]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Presets
          content:
            application/json:
              schema: { type: array, maxItems: 54, items: { $ref: '#/components/schemas/EasePreset' } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
    put:
      operationId: putEasePresets
      tags: [orders]
      summary: Replace the tailor's saved ease values
      x-audit: settings_change
      x-roles: [tailor]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: array, maxItems: 54, items: { $ref: '#/components/schemas/EasePreset' } }
      responses:
        '200':
          description: Saved presets
          content:
            application/json:
              schema: { type: array, maxItems: 54, items: { $ref: '#/components/schemas/EasePreset' } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /clients:
    get:
      operationId: listClients
      tags: [clients]
      summary: List clients
      x-roles: [tailor, admin]
      x-ownership: tailors see their own clients only
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: search, in: query, schema: { type: string, maxLength: 60 } }
        - { name: sort, in: query, schema: { type: string, enum: [last_capture, code, name] } }
        - { name: filter, in: query, schema: { type: string, enum: [has_new, has_flags, no_profiles] } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: One page of clients
          content: { application/json: { schema: { $ref: '#/components/schemas/ClientPage' } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      operationId: createClient
      tags: [clients]
      summary: Issue a client code
      x-audit: code_issue
      x-roles: [tailor]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ClientInput' } } }
      responses:
        '201':
          description: The new code
          content: { application/json: { schema: { $ref: '#/components/schemas/ClientCreated' } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /clients/{client_id}:
    parameters:
      - { $ref: '#/components/parameters/ClientId' }
    get:
      operationId: getClient
      tags: [clients]
      summary: One client
      x-roles: [tailor, admin]
      x-ownership: tailors see their own clients only
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Client
          content: { application/json: { schema: { $ref: '#/components/schemas/ClientDetail' } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updateClient
      tags: [clients]
      summary: Edit a client's display name or height
      x-audit: client_update
      x-roles: [tailor, admin]
      x-ownership: tailors change their own clients only
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ClientInput' } } }
      responses:
        '200':
          description: Updated client
          content: { application/json: { schema: { $ref: '#/components/schemas/ClientDetail' } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    delete:
      operationId: deleteClient
      tags: [clients]
      summary: Delete a client's data
      description: The API marks the client for deletion at once, and the retention job removes the rows.
      x-audit: deletion
      x-roles: [tailor, admin]
      x-ownership: tailors delete their own clients only
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Marked for deletion }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /clients/{client_id}/rotate-code:
    parameters:
      - { $ref: '#/components/parameters/ClientId' }
    post:
      operationId: rotateClientCode
      tags: [clients]
      summary: Replace a client's code, so the old one stops working
      x-audit: code_rotate
      x-roles: [tailor]
      x-ownership: own clients only
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: The new code
          content: { application/json: { schema: { $ref: '#/components/schemas/ClientCodeRotated' } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /clients/{client_id}/profiles:
    parameters:
      - { $ref: '#/components/parameters/ClientId' }
    get:
      operationId: listClientProfiles
      tags: [clients]
      summary: A client's profiles, newest first
      x-roles: [tailor, admin]
      x-ownership: tailors see their own clients only
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Profiles
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ProfileSummary' } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /profiles/{profile_id}:
    get:
      operationId: getProfile
      tags: [profiles]
      summary: One full profile. Every call is audited
      x-audit: profile_view
      x-roles: [tailor, admin]
      x-ownership: tailors see their own clients only
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: profile_id, in: path, required: true, schema: { type: string, format: uuid, maxLength: 36 } }
      responses:
        '200':
          description: Profile
          content: { application/json: { schema: { $ref: '#/components/schemas/MeasurementProfile' } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /conflicts:
    get:
      operationId: listConflicts
      tags: [profiles]
      summary: Unresolved sync conflicts, with both versions
      x-roles: [tailor]
      x-ownership: own clients only
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Conflicts
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Conflict' } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /conflicts/{conflict_id}/resolve:
    post:
      operationId: resolveConflict
      tags: [profiles]
      summary: Choose which version to keep
      x-audit: conflict_resolve
      x-roles: [tailor]
      x-ownership: own clients only
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: conflict_id, in: path, required: true, schema: { type: string, format: uuid, maxLength: 36 } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ConflictResolution' } } }
      responses:
        '200':
          description: The conflict after resolution
          content: { application/json: { schema: { $ref: '#/components/schemas/Conflict' } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: The order queue
      x-roles: [tailor]
      x-ownership: own orders only
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/OrderStatus' } }
        - { name: sort, in: query, schema: { type: string, enum: [due_date, created_at] } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: One page of orders
          content: { application/json: { schema: { $ref: '#/components/schemas/OrderPage' } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      operationId: createOrder
      tags: [orders]
      summary: Create an order from a profile
      x-audit: order_create
      x-roles: [tailor]
      x-ownership: own clients only
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/OrderInput' } } }
      responses:
        '201':
          description: The new order
          content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /orders/{order_id}:
    parameters:
      - { $ref: '#/components/parameters/OrderId' }
    get:
      operationId: getOrder
      tags: [orders]
      summary: One order
      x-roles: [tailor]
      x-ownership: own orders only
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Order
          content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updateOrder
      tags: [orders]
      summary: Change status, due date, notes or items
      x-audit: status_change, order_update or override
      x-roles: [tailor]
      x-ownership: own orders only
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/OrderUpdate' } } }
      responses:
        '200':
          description: Updated order
          content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    delete:
      operationId: deleteOrder
      tags: [orders]
      summary: Delete an order that is still new
      x-audit: order_delete
      x-roles: [tailor]
      x-ownership: own orders only
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /ease-suggestions:
    get:
      operationId: getEaseSuggestions
      tags: [orders]
      summary: Suggested ease per site, with where each value came from
      x-roles: [tailor]
      x-ownership: own clients only
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: client_id, in: query, required: true, schema: { type: string, format: uuid, maxLength: 36 } }
        - { name: profile_id, in: query, required: true, schema: { type: string, format: uuid, maxLength: 36 } }
        - { name: garment_type, in: query, required: true, schema: { $ref: '#/components/schemas/GarmentType' } }
      responses:
        '200':
          description: Suggestions
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/EaseSuggestion' } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /orders/{order_id}/sheets:
    parameters:
      - { $ref: '#/components/parameters/OrderId' }
    post:
      operationId: createSheet
      tags: [sheets]
      summary: Generate a specification sheet
      x-audit: export
      x-roles: [tailor]
      x-ownership: own orders only
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SheetInput' } } }
      responses:
        '201':
          description: The sheet, with links that expire after 10 minutes
          content: { application/json: { schema: { $ref: '#/components/schemas/Sheet' } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /files/sheets/{sheet_file}:
    get:
      operationId: getSheetFile
      tags: [sheets]
      summary: Download a sheet through a signed link
      description: The only binary responses in the API. They are server-rendered sheets, never client photos.
      parameters:
        - name: sheet_file
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9a-f-]{36}\.(png|pdf)$'
        - { name: exp, in: query, required: true, schema: { type: integer } }
        - { name: sig, in: query, required: true, schema: { type: string, pattern: '^[0-9a-f]{64}$' } }
      responses:
        '200':
          description: The file
          content:
            image/png: { schema: { type: string, format: binary } }
            application/pdf: { schema: { type: string, format: binary } }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /sheets/{sheet_id}/shares:
    post:
      operationId: logShare
      tags: [sheets]
      summary: Record that a sheet was shared
      x-audit: share
      x-roles: [tailor]
      x-ownership: own orders only
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: sheet_id, in: path, required: true, schema: { type: string, format: uuid, maxLength: 36 } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ShareInput' } } }
      responses:
        '204': { description: Recorded }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /audit:
    get:
      operationId: listAudit
      tags: [audit]
      summary: Audit log. Tailors and measurers see only their own actions
      x-roles: [tailor, admin, measurer]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: user, in: query, schema: { type: string, format: uuid, maxLength: 36 } }
        - { name: action, in: query, schema: { $ref: '#/components/schemas/AuditAction' } }
        - { name: entity_type, in: query, schema: { type: string, maxLength: 40 } }
        - { name: from, in: query, schema: { type: string, format: date-time, maxLength: 32 } }
        - { name: to, in: query, schema: { type: string, format: date-time, maxLength: 32 } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: One page of audit entries
