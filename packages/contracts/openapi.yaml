      type: object
      additionalProperties: false
      required: [log_id, occurred_at, actor_type, user_email, role, action, entity_type, entity_id, summary]
      properties:
        log_id: { type: string, maxLength: 24 }
        occurred_at: { type: string, format: date-time, maxLength: 32 }
        actor_type: { type: string, enum: [user, client, system] }
        user_email: { type: [string, 'null'], maxLength: 254 }
        role: { type: [string, 'null'], enum: [tailor, admin, measurer, null] }
        action: { $ref: '#/components/schemas/AuditAction' }
        entity_type: { type: string, maxLength: 40 }
        entity_id: { type: string, maxLength: 64 }
        summary: { type: string, maxLength: 256 }

    Account:
      type: object
      additionalProperties: false
      required: [user_id, email, role, status, created_at]
      properties:
        user_id: { type: string, format: uuid, maxLength: 36 }
        email: { type: string, format: email, maxLength: 254 }
        role: { $ref: '#/components/schemas/Role' }
        status: { $ref: '#/components/schemas/AccountStatus' }
        business_name: { type: string, maxLength: 120 }
        phone: { type: string, maxLength: 16 }
        area: { type: string, maxLength: 120 }
        measurer_code: { type: string, maxLength: 4 }
        trained_on: { type: string, format: date, maxLength: 10 }
        created_at: { type: string, format: date-time, maxLength: 32 }
    RejectInput:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 256 }
    MeasurerInput:
      type: object
      additionalProperties: false
      required: [email, password, measurer_code, trained_on]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 10, maxLength: 256 }
        measurer_code: { type: string, pattern: '^[A-Z]{1,4}$' }
        trained_on: { type: string, format: date, maxLength: 10 }
    Approvals:
      description: >
        A9. Study writes are refused in production until the first five fields are filled and either
        60 days have passed since dpia_submitted_on or odpc_response_on is recorded.
      type: object
      additionalProperties: false
      required:
        - ierc_ref
        - nacosti_licence_no
        - dpia_submitted_on
        - approvals_confirmed_by
        - confirmed_at
        - odpc_response_on
        - odpc_response_ref
      properties:
        ierc_ref: { type: [string, 'null'], maxLength: 80 }
        nacosti_licence_no: { type: [string, 'null'], maxLength: 80 }
        dpia_submitted_on: { type: [string, 'null'], format: date, maxLength: 10 }
        approvals_confirmed_by: { type: [string, 'null'], maxLength: 120 }
        confirmed_at: { type: [string, 'null'], format: date-time, maxLength: 32 }
        odpc_response_on: { type: [string, 'null'], format: date, maxLength: 10 }
        odpc_response_ref: { type: [string, 'null'], maxLength: 80 }
    AdminSettingsInput:
      type: object
      additionalProperties: false
      properties:
        retention_months: { type: integer, minimum: 1, maximum: 120 }
        audit_retention_months: { type: integer, minimum: 1, maximum: 120 }
        study_mode: { type: boolean }
        study_collection_end: { type: [string, 'null'], format: date, maxLength: 10 }
        current_rules_version: { $ref: '#/components/schemas/RulesVersion' }
        min_app_version: { type: string, maxLength: 20 }
        approvals: { $ref: '#/components/schemas/Approvals' }
    AdminSettings:
      type: object
      additionalProperties: false
      required:
        - retention_months
        - audit_retention_months
        - study_mode
        - study_collection_end
        - current_rules_version
        - min_app_version
        - consent_version
        - approvals
        - approvals_missing
        - earliest_collection_date
      properties:
        retention_months: { type: integer, minimum: 1, maximum: 120 }
        audit_retention_months: { type: integer, minimum: 1, maximum: 120 }
        study_mode: { type: boolean }
        study_collection_end: { type: [string, 'null'], format: date, maxLength: 10 }
        current_rules_version: { $ref: '#/components/schemas/RulesVersion' }
        min_app_version: { type: string, maxLength: 20 }
        consent_version: { type: string, maxLength: 20 }
        approvals: { $ref: '#/components/schemas/Approvals' }
        approvals_missing:
          description: The approval fields still empty, for the admin banner.
          type: array
          items: { type: string, maxLength: 40 }
        earliest_collection_date: { type: [string, 'null'], format: date, maxLength: 10 }
    RulesArtifact:
      description: The API also validates the whole artifact against packages/rules/schema.json, which allows no free-form content.
      type: object
      additionalProperties: true
      required: [rules_version, status, checksum]
      properties:
        rules_version: { $ref: '#/components/schemas/RulesVersion' }
        status: { type: string, enum: [draft, frozen, retired] }
        checksum: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
    RulesSummary:
      type: object
      additionalProperties: false
      required: [rules_version, status, checksum, parent, frozen_at, created_at, is_current]
      properties:
        rules_version: { $ref: '#/components/schemas/RulesVersion' }
        status: { type: string, enum: [draft, frozen, retired] }
        checksum: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        parent: { type: [string, 'null'], maxLength: 40 }
        frozen_at: { type: [string, 'null'], format: date-time, maxLength: 32 }
        created_at: { type: string, format: date-time, maxLength: 32 }
        is_current: { type: boolean }
    RederiveResult:
      type: object
      additionalProperties: false
      required: [rules_version, cohort, profiles_processed]
      properties:
        rules_version: { $ref: '#/components/schemas/RulesVersion' }
        cohort: { $ref: '#/components/schemas/Cohort' }
        profiles_processed: { type: integer, minimum: 0 }

    Participant:
      type: object
      additionalProperties: false
      required: [participant_id, participant_code, client_code, sex, age_band, venue, cohort, enrolled_at, sets_captured, readings_entered]
      properties:
        participant_id: { type: string, format: uuid, maxLength: 36 }
        participant_code: { $ref: '#/components/schemas/ParticipantCode' }
        client_code: { $ref: '#/components/schemas/ClientCode' }
        sex: { $ref: '#/components/schemas/Sex' }
        age_band: { $ref: '#/components/schemas/AgeBand' }
        venue: { type: string, maxLength: 80 }
        cohort: { $ref: '#/components/schemas/Cohort' }
        enrolled_at: { type: string, format: date-time, maxLength: 32 }
        sets_captured: { type: integer, minimum: 0, maximum: 3 }
        readings_entered: { type: integer, minimum: 0, maximum: 4 }
    AgeBand: { type: string, enum: ['18-24', '25-34', '35-44', '45-54', '55+'] }
    ParticipantInput:
      type: object
      additionalProperties: false
      required: [participant_code, sex, age_band, venue]
      properties:
        participant_code: { $ref: '#/components/schemas/ParticipantCode' }
        sex: { $ref: '#/components/schemas/Sex' }
        age_band: { $ref: '#/components/schemas/AgeBand' }
        venue: { type: string, maxLength: 80 }
    ParticipantUpdate:
      type: object
      additionalProperties: false
      properties:
        sex: { $ref: '#/components/schemas/Sex' }
        age_band: { $ref: '#/components/schemas/AgeBand' }
        venue: { type: string, maxLength: 80 }
        cohort: { $ref: '#/components/schemas/Cohort' }
    SiteValues:
      description: Millimetres per site, for all nine sites.
      type: object
      additionalProperties: false
      required: [stature, shoulder, chest, waist, hip, sleeve, outleg, inleg, neck]
      properties:
        stature: { type: integer, minimum: 100, maximum: 3000 }
        shoulder: { type: integer, minimum: 100, maximum: 3000 }
        chest: { type: integer, minimum: 100, maximum: 3000 }
        waist: { type: integer, minimum: 100, maximum: 3000 }
        hip: { type: integer, minimum: 100, maximum: 3000 }
        sleeve: { type: integer, minimum: 100, maximum: 3000 }
        outleg: { type: integer, minimum: 100, maximum: 3000 }
        inleg: { type: integer, minimum: 100, maximum: 3000 }
        neck: { type: integer, minimum: 100, maximum: 3000 }
    ReferenceReadingInput:
      type: object
      additionalProperties: false
      required: [participant_code, reading_no, values, taken_at]
      properties:
        participant_code: { $ref: '#/components/schemas/ParticipantCode' }
        reading_no: { type: integer, enum: [1, 2] }
        values: { $ref: '#/components/schemas/SiteValues' }
        taken_at: { type: string, format: date-time, maxLength: 32 }
    ReferenceReadingReceipt:
      type: object
      additionalProperties: false
      required: [participant_code, reading_no, measurer_code, out_of_order]
      properties:
        participant_code: { $ref: '#/components/schemas/ParticipantCode' }
        reading_no: { type: integer, enum: [1, 2] }
        measurer_code: { type: string, maxLength: 4 }
        out_of_order: { type: boolean }
    OwnReading:
      type: object
      additionalProperties: false
      required: [participant_code, reading_no, site_code, value_mm, taken_at]
      properties:
        participant_code: { $ref: '#/components/schemas/ParticipantCode' }
        reading_no: { type: integer, enum: [1, 2] }
        site_code: { $ref: '#/components/schemas/SiteCode' }
        value_mm: { type: integer, minimum: 100, maximum: 3000 }
        taken_at: { type: string, format: date-time, maxLength: 32 }
    ReferenceReading:
      type: object
      additionalProperties: false
      required: [ref_id, participant_code, measurer_code, reading_no, site_code, value_mm, taken_at, out_of_order, correction]
      properties:
        ref_id: { type: string, format: uuid, maxLength: 36 }
        participant_code: { $ref: '#/components/schemas/ParticipantCode' }
        measurer_code: { type: string, maxLength: 4 }
        reading_no: { type: integer, enum: [1, 2] }
        site_code: { $ref: '#/components/schemas/SiteCode' }
        value_mm: { type: integer, minimum: 100, maximum: 3000 }
        taken_at: { type: string, format: date-time, maxLength: 32 }
        out_of_order: { type: boolean }
        correction:
          oneOf:
            - { $ref: '#/components/schemas/ReadingCorrection' }
            - { type: 'null' }
    ReadingCorrection:
      type: object
      additionalProperties: false
      required: [value_mm, reason, corrected_at]
      properties:
        value_mm: { type: integer, minimum: 100, maximum: 3000 }
        reason: { type: string, maxLength: 256 }
        corrected_at: { type: string, format: date-time, maxLength: 32 }
    ReadingCorrectionInput:
      type: object
      additionalProperties: false
      required: [value_mm, reason]
      properties:
        value_mm: { type: integer, minimum: 100, maximum: 3000 }
        reason: { type: string, minLength: 1, maxLength: 256 }

    ClientPage:
      type: object
      additionalProperties: false
      required: [items, page, page_size, total]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ClientSummary' } }
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0 }
    OrderPage:
      type: object
      additionalProperties: false
      required: [items, page, page_size, total]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/OrderSummary' } }
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0 }
    AuditPage:
      type: object
      additionalProperties: false
      required: [items, page, page_size, total]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AuditEntry' } }
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0 }
    AccountPage:
      type: object
      additionalProperties: false
      required: [items, page, page_size, total]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Account' } }
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0 }
