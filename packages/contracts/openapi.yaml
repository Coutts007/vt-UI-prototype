components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    PageSize: { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
    ClientId: { name: client_id, in: path, required: true, schema: { type: string, format: uuid, maxLength: 36 } }
    OrderId: { name: order_id, in: path, required: true, schema: { type: string, format: uuid, maxLength: 36 } }
    UserId: { name: user_id, in: path, required: true, schema: { type: string, format: uuid, maxLength: 36 } }
  responses:
    Problem:
      description: An RFC 9457 error, with a stable code from error-codes.json
      content:
        application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } }
    RateLimited:
      description: Too many requests
      headers:
        Retry-After:
          description: Seconds to wait before trying again
          required: true
          schema: { type: integer, minimum: 0 }
      content:
        application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } }
    ProfileConflict:
      description: The profile was kept as a conflict for the tailor, or the app is too old
      content:
        application/problem+json:
          schema:
            oneOf:
              - { $ref: '#/components/schemas/ProfileVersionConflict' }
              - { $ref: '#/components/schemas/Problem' }
  schemas:
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, code]
      properties:
        type: { type: string, maxLength: 256 }
        title: { type: string, maxLength: 256 }
        status: { type: integer }
        code: { type: string, maxLength: 64 }
        detail: { type: string, maxLength: 1000 }
        errors:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [field, code]
            properties:
              field: { type: string, maxLength: 256 }
              code: { type: string, maxLength: 64 }
    ProfileVersionConflict:
      type: object
      additionalProperties: false
      required: [type, title, status, code, server_version, conflict_id]
      properties:
        type: { type: string, maxLength: 256 }
        title: { type: string, maxLength: 256 }
        status: { type: integer, const: 409 }
        code: { type: string, const: profile_version_conflict }
        detail: { type: string, maxLength: 1000 }
        server_version: { type: integer, minimum: 1, maximum: 100000 }
        conflict_id: { type: string, format: uuid, maxLength: 36 }
    Status:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [ok, unavailable] }

    SiteCode: { type: string, enum: [stature, shoulder, chest, waist, hip, sleeve, outleg, inleg, neck] }
    Flag: { type: string, enum: [pass, check, fail] }
    FlagReason:
      type: string
      enum:
        - scale_disagree
        - level_unchecked
        - loose_clothing
        - landmark_low
        - mask_gap
        - out_of_range
        - crotch_not_found
        - marker_weak
        - waist_level_mismatch
        - chest_level_mismatch
        - view_failed
        - free_arm_unknown
    CheckState: { type: string, enum: [pass, fail, skipped] }
    ClientCode: { type: string, pattern: '^[A-Z]{2}[0-9]{4}$' }
    ParticipantCode: { type: string, pattern: '^P[0-9]{3}$' }
    RulesVersion: { type: string, pattern: '^[0-9]+\.[0-9]+-[a-z0-9-]+$', maxLength: 40 }
    Locale: { type: string, enum: [en, sw] }
    Unit: { type: string, enum: [cm, in] }
    Role: { type: string, enum: [tailor, admin, measurer] }
    AccountStatus: { type: string, enum: [pending, active, disabled, rejected] }
    Cohort: { type: string, enum: [pilot, calibration, test] }
    Sex: { type: string, enum: [female, male, unspecified] }
    ClothingFit: { type: string, enum: [fitted, loose] }
    GarmentType: { type: string, enum: [shirt, dress, trousers, suit_jacket, skirt, other] }
    OrderStatus: { type: string, enum: [new, cutting, fitting, ready, collected] }
    ProfileStatus: { type: string, enum: [final, conflict, superseded, deleted] }
    AuditAction:
      type: string
      enum:
        - register
        - login
        - login_failed
        - logout
        - settings_change
        - profile_ingest
        - profile_view
        - deletion_request
        - access_request
        - deletion
        - code_issue
        - code_rotate
        - client_update
        - conflict_resolve
        - order_create
        - order_update
        - order_delete
        - status_change
        - override
        - export
        - share
        - approve
        - account_reject
        - account_disable
        - account_enable
        - account_create
        - rules_register
        - rules_freeze
        - rederive
        - participant_create
        - participant_update
        - reference_entry
        - reference_correction

    PublicSettings:
      type: object
      additionalProperties: false
      required: [study_mode, consent_version, min_app_version, current_rules_version]
      properties:
        study_mode: { type: boolean }
        consent_version: { type: string, maxLength: 20 }
        min_app_version: { type: string, maxLength: 20 }
        current_rules_version: { $ref: '#/components/schemas/RulesVersion' }
    ClientCodeCheck:
      type: object
      additionalProperties: false
      required: [valid, tailor_business_name, height_mm]
      properties:
        valid: { type: boolean, const: true }
        tailor_business_name: { type: string, maxLength: 120 }
        height_mm: { type: [integer, 'null'], minimum: 1200, maximum: 2200 }

    Landmark:
      type: object
      additionalProperties: false
      required: [x, y, z, visibility]
      properties:
        x: { type: number, minimum: -0.5, maximum: 1.5 }
        y: { type: number, minimum: -0.5, maximum: 1.5 }
        z: { type: number, minimum: -10, maximum: 10 }
        visibility: { type: number, minimum: 0, maximum: 1 }
    LandmarkSet:
      type: array
      minItems: 33
      maxItems: 33
      items: { $ref: '#/components/schemas/Landmark' }
    MarkerObs:
      type: object
      additionalProperties: false
      required: [corners, image_w, image_h, side_px, confidence]
      properties:
        corners:
          type: array
          minItems: 4
          maxItems: 4
          items:
            type: array
            minItems: 2
            maxItems: 2
            items: { type: number, minimum: 0, maximum: 8192 }
        image_w: { type: integer, minimum: 1, maximum: 8192 }
        image_h: { type: integer, minimum: 1, maximum: 8192 }
        side_px: { type: number, minimum: 0, maximum: 8192 }
        confidence: { type: number, minimum: 0, maximum: 1 }
    MmProfile:
      description: 101 samples from the top (0) to the bottom (100) of the mask. Null where undefined.
      type: array
      minItems: 101
      maxItems: 101
      items: { type: [number, 'null'], minimum: 0, maximum: 400 }
    SilhouetteFront:
      type: object
      additionalProperties: false
      required: [samples, mask_top_px, mask_bottom_px, image_w, image_h, half_width_mm, crotch_y_px]
      properties:
        samples: { type: integer, const: 101 }
        mask_top_px: { type: number, minimum: 0, maximum: 8192 }
        mask_bottom_px: { type: number, minimum: 0, maximum: 8192 }
        image_w: { type: integer, minimum: 1, maximum: 8192 }
        image_h: { type: integer, minimum: 1, maximum: 8192 }
        half_width_mm: { $ref: '#/components/schemas/MmProfile' }
        centre_x_px:
          description: Torso centre line in pixels, so the millimetre limit does not apply.
          type: array
          minItems: 101
          maxItems: 101
          items: { type: [number, 'null'], minimum: 0, maximum: 8192 }
        crotch_y_px: { type: [number, 'null'], minimum: 0, maximum: 8192 }
    SilhouetteSide:
      type: object
      additionalProperties: false
      required: [samples, mask_top_px, mask_bottom_px, image_w, image_h, half_depth_mm, anterior_mm]
      properties:
        samples: { type: integer, const: 101 }
        mask_top_px: { type: number, minimum: 0, maximum: 8192 }
        mask_bottom_px: { type: number, minimum: 0, maximum: 8192 }
        image_w: { type: integer, minimum: 1, maximum: 8192 }
        image_h: { type: integer, minimum: 1, maximum: 8192 }
        half_depth_mm: { $ref: '#/components/schemas/MmProfile' }
        anterior_mm: { $ref: '#/components/schemas/MmProfile' }
    ViewChecks:
      type: object
      additionalProperties: false
      required: [level, frame, distance, symmetry, arms, marker, light, sharpness]
      properties:
        level: { $ref: '#/components/schemas/CheckState' }
