# Adds to docker-compose.yml for the client tests against the real API, on one laptop only.
# Demo data and no rate limits: never use this anywhere else.
services:
  api:
    ports:
      - '127.0.0.1:${VT_E2E_API_PORT:-8010}:8000'
    environment:
      ENV: development
      DIRECTORY_ENABLED: 'true'
      RATE_LIMITS_OFF: 'true'
  caddy:
    profiles: [unused]
