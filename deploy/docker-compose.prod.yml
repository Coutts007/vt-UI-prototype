# The cloud VM (M16, backend-spec 16): one machine, Docker Compose, Caddy with a public
# certificate, everything under one directory on the encrypted disk, nightly encrypted backups.
# Start it with `make prod-up`, never by hand, so the checks in scripts/prod.sh run first.
# deploy/prod.env holds the secrets and the site address; it is git-ignored.
services:
  db:
    restart: unless-stopped
    volumes: !override
      - ${VT_DATA_DIR:?set VT_DATA_DIR in deploy/prod.env}/db:/var/lib/postgresql/data
  migrate:
    environment:
      ENV: production
  api:
    restart: unless-stopped
    environment:
      ENV: production
      TRUSTED_PROXIES: 172.16.0.0/12
    # Two workers share one CPU and a half (M12-13); the rate limiter's counts are in the
    # database since M16, so each worker sees the same sign-in attempts.
    command:
      - .venv/bin/uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - '8000'
      - --no-access-log
      - --workers
      - ${VT_API_WORKERS:-2}
    volumes: !override
      - ${VT_DATA_DIR}/sheets:/data/sheets
  jobs:
    restart: unless-stopped
    environment:
      ENV: production
    volumes: !override
      - ${VT_DATA_DIR}/sheets:/data/sheets
      - ${VT_DATA_DIR}/reports:/data/reports
  caddy:
    restart: unless-stopped
    environment:
      VT_SITE_ADDRESS: ${VT_SITE_ADDRESS:?set VT_SITE_ADDRESS in deploy/prod.env}
      VT_TLS: ${VT_ACME_EMAIL:?set VT_ACME_EMAIL in deploy/prod.env}
    volumes: !override
      - ${VT_DATA_DIR}/caddy:/data
  # Nightly pg_dump at 03:00 Nairobi (after the 02:00 retention job), encrypted with age to the
  # owner's public key, kept 30 days (backend-spec 14.7). The private key never comes near the VM.
  backup:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backup
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-vt}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/prod.env}
      PGDATABASE: ${POSTGRES_DB:-vt}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:?set BACKUP_AGE_RECIPIENT in deploy/prod.env}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
    volumes:
      - ${VT_DATA_DIR}/backups:/backups
    depends_on:
      db:
        condition: service_healthy
