[project]
name = "vt-api"
version = "0.1.0"
description = "Virtual Tailor API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "pydantic-settings>=2.6",
  "structlog>=24.4",
  "uvicorn>=0.32",
  "alembic>=1.14",
  "argon2-cffi>=23.1",
  "asyncpg>=0.30",
  "pyjwt>=2.10",
  "sqlalchemy[asyncio]>=2.0.36",
  "typer>=0.15",
]

[project.scripts]
vt = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
