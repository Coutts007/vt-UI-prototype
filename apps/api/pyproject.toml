[project]
name = "vt-api"
version = "0.1.0"
description = "Virtual Tailor API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "pydantic-settings>=2.6",
  "structlog>=24.4",
  "uvicorn>=0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
