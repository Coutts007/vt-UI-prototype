name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v5
        with:
          version: '0.13.6'
      - run: make setup
      - run: make lint
      - run: make typecheck
      - run: make test
      - run: make licences
      - run: make build

  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v5
        with:
          version: '0.13.6'
      - run: make setup
      - run: make parity
      - run: uv run pytest packages/py/vt_measure --cov=vt_measure --cov-fail-under=95

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v5
        with:
          version: '0.13.6'
      - run: make setup
      - run: make contract

  e2e:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Placeholder until M12"
