name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git fetch origin main:refs/remotes/origin/main || true
      - run: sh scripts/frozen_guard.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v5
        with:
          version: '0.13.6'
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
      - run: make setup
      - run: make lint
      - run: make typecheck
      - run: make test
      - run: make licences
      - run: make build

  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v5
        with:
          version: '0.13.6'
      - run: make setup
      - run: make parity
      - run: uv run pytest packages/py/vt_measure --cov=vt_measure --cov-fail-under=95

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v5
        with:
          version: '0.13.6'
      - run: make setup
      - run: make contract

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v5
        with:
          version: '0.13.6'
      - run: make setup
      - run: pnpm --filter @vt/web exec playwright install --with-deps chromium
      - run: make e2e
      - run: make build
      - run: node scripts/budget.mjs

  # Backend-spec 15.5: the browser suites on the compose stack through Caddy with the production
  # headers, then the production build with rate limits on (M12).
  e2e-real-api:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v5
        with:
          version: '0.13.6'
      - run: make setup
      - run: pnpm --filter @vt/web exec playwright install --with-deps chromium
      - run: make e2e-real-api
      - run: make stack-check

  # Backend-spec 15.5 item 3 and 17.1: schemathesis on every endpoint as nobody, a tailor and the
  # admin. Bounded so a run stays under about 30 minutes.
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: '0.13.6'
      - run: uv sync --frozen
      - run: make fuzz
        env:
          FUZZ_EXAMPLES: '10'
          FUZZ_SECONDS: '540'
